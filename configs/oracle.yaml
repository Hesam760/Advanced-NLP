system_name: oracle
phase: 1
description: "Oracle QA using gold passages from the Dev labels"

models:
  llm:
    name: Qwen/Qwen3.5-9B
    where: "Kaggle, Transformers, BitsAndBytes NF4 4-bit"
    quantization: nf4
    double_quantization: true
    compute_dtype: float16

  embedder: null
  reranker: null

settings:
  retrieval:
    method: gold_doc_ids
    unit: passage

  generation:
    do_sample: false
    enable_thinking: false
    max_new_tokens: 64
    max_input_tokens: 6144

  use_context: true

source_predictions:
  dev: runs/dev/context_oracle_qwen3_5_9b/predictions.jsonl
